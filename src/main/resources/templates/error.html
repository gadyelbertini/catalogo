<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-danger text-white">
            <h3 class="mb-0">Ocorreu um erro</h3>
        </div>
        <div class="card-body">
            <p>Desculpe, houve um problema ao processar sua requisição.</p>
            <p>Por favor, tente novamente ou volte para a página inicial.</p>
            <a th:href="@{/produtos}" class="btn btn-primary">Voltar ao catálogo</a>
        </div>
    </div>
</div>
</body>
</html>
