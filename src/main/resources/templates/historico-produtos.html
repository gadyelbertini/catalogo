<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Auditoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/produtos">FATEC Catálogo</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/produtos}">Produtos</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card shadow">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <div>
                <h2 class="mb-0">Painel de Auditoria</h2>
                <p class="mb-0 text-muted">Produtos ordenados pela última atualização.</p>
            </div>
            <a class="btn btn-secondary" href="/produtos">Voltar</a>
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Categoria</th>
                    <th>Quantidade</th>
                    <th>Preço (R$)</th>
                    <th>Última Atualização</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${produtos}"
                    th:classappend="${p.quantidade != null and p.quantidade < 5} ? 'table-warning' : ''">
                    <td th:text="${p.idProduto}"></td>
                    <td th:text="${p.nome}"></td>
                    <td th:text="${p.categoria != null ? p.categoria.nome : 'Sem Categoria'}"></td>
                    <td th:text="${p.quantidade}"></td>
                    <td th:text="${#numbers.formatDecimal(p.valor, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td th:text="${p.dataAtualizacao != null ? #temporals.format(p.dataAtualizacao, 'dd/MM/yyyy HH:mm') : 'N/A'}"></td>
                </tr>
                </tbody>
            </table>
            <div class="alert alert-info" role="alert">
                Produtos com estoque baixo (&lt; 5) aparecem destacados em amarelo.
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
